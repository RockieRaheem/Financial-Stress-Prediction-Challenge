[project]
name = "liquidity-stress-prediction"
version = "0.1.0"
description = "Reproducible modeling pipeline for the Zindi liquidity stress challenge"
requires-python = ">=3.11,<3.13"
dependencies = [
    "catboost>=1.2.8,<2",
    "faiss-cpu>=1.15.1",
    "lightgbm>=4.6,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pytabkit>=1.7.3",
    "rtdl-num-embeddings>=0.0.12",
    "scikit-learn>=1.6,<2",
    "seaborn>=0.13,<1",
    "tabm>=0.0.3",
    "xgboost>=3.1,<4",
]

[tool.uv]
package = false
